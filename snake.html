<!DOCTYPE html>
<!-- ==================================================================
     贪吃蛇游戏页
     结构：左上角成就墙入口 → 右上角固定按钮（音效开关 / 全屏）→ 标题 →
          主布局（游戏容器：500×500 画布 + 开始/暂停/结束三块遮罩 +
          右侧 STATS 记分面板 + KEYS 键位说明栏）
     脚本：audio.js 公共音效库 / fx.js 画布与特效库 / fullscreen.js 全屏控制 /
          ach-common.js 共享成就系统 / gamepad.js 手柄支持 / snake.js 游戏逻辑
     共享：ach-trigger.css / ach-trigger.js 金杯成就墙触发器（点击等效按 V 开合成就墙）
     ================================================================== -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 像素街机厅</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- 成就墙·金杯触发器共享样式 -->
    <link rel="stylesheet" href="ach-trigger.css?v=20261118-1">
    <style>
        /* ---------- 主题变量：底色 / 面板 / 四色霓虹 / 文字 ---------- */
        :root {
            --bg: #0a140a;
            --panel: rgba(18, 42, 18, 0.96);
            --neon-green: #39ff6a;
            --neon-pink: #ff3ea5;
            --neon-blue: #35e0ff;
            --neon-yellow: #ffd23e;
            --text: #e8ffe8;
        /* ---- 成就墙皮肤主题映射（Wave2 收编）：本页仅留取值行，规则本体统一在 ach-trigger.css 收编层，取值与原页内皮肤逐字一致 ---- */
        --ach-accent: 57, 255, 106; /* 主题色 RGB 三元组：面板描边/辉光、关闭键、脚注、副标题 */
        --ach-sec: 57, 255, 106; /* 次主题色 RGB 三元组：计数文本 */
        --ach-wall-bg: rgba(4, 10, 6, 0.72); /* 遮罩底色 */
        --ach-panel-grad: linear-gradient(160deg, rgba(16, 36, 26, 0.80) 0%, rgba(11, 26, 18, 0.80) 55%, rgba(13, 24, 16, 0.80) 100%); /* 面板渐变底 */
        --ach-panel-glow: rgba(57, 255, 106, 0.22); /* 面板外辉光段 */
        --ach-desc-c: #8fa08f; /* 卡片描述文字 */
        --ach-meta-c: #6f7d6f; /* 进度区元信息文字 */
        --ach-locked-c: #77857a; /* 未解锁卡片名称 */
        --ach-unlock-desc-c: #a9bca9; /* 已解锁卡片描述 */
        --ach-bar-grad: linear-gradient(90deg, #39ff6a, #ffd23e); /* 总进度条渐变 */
        --ach-prog-grad: linear-gradient(90deg, #35e0ff, #39ff6a); /* 卡片进度条渐变 */
        --ach-unlock-prog-grad: linear-gradient(90deg, #39ff6a, #ffd23e); /* 已解锁卡片进度条渐变 */
        --ach-toast-grad: linear-gradient(120deg, rgba(18, 42, 18, 0.95), rgba(10, 22, 14, 0.95)); /* toast 渐变底 */
        }
        /* html 画布底色随主题：全屏切换瞬间 overflow 切换 + 合成层重建触发重新光栅化，会间歇性闪现画布默认白底（视口底部白条根因），画布底色变暗后不可见 */
        html { background: var(--bg); }

        /* ---------- 基础布局：全屏垂直居中 ---------- */
        * { box-sizing: border-box; }
        body {
            user-select: none; /* 全局禁止文本选取：鼠标拖动不再框选界面文字、不触发浏览器选中搜索 */
            -webkit-user-select: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: radial-gradient(ellipse at 50% 0%, #1c401c 0%, var(--bg) 65%);
            font-family: 'Microsoft YaHei', sans-serif;
            color: var(--text);
        }
        /* CRT 扫描线氛围 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
        }
        /* 视口边缘氛围灯带：弱于游戏区边框灯带，勾勒屏幕轮廓而不喧宾夺主 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            transform: translateZ(0); /* 独立合成层：edgeFlow 的 box-shadow 每帧重绘隔离于本层，不再与 hover 重绘叠加波及整页引发闪屏 */
            box-shadow: inset 0 0 64px rgba(255, 154, 62, 0.10);
            animation: edgeFlow 8s ease-in-out infinite;
        }
        /* 边缘灯带流光：橙 → 粉 → 蓝循环（与画布灯带同节奏、低亮度） */
        @keyframes edgeFlow {
            0%, 100% { box-shadow: inset 0 0 64px rgba(255, 154, 62, 0.10); }
            33% { box-shadow: inset 0 0 64px rgba(255, 62, 165, 0.11); }
            66% { box-shadow: inset 0 0 64px rgba(53, 224, 255, 0.11); }
        }
        /* ---------- 视口四周环绕光带：主题色霓虹流光绕屏幕边缘匀速巡游 ---------- */
        #edgeBeam {
            position: fixed;
            inset: 0;
            z-index: 6; /* 置于暗角之上、左上角成就墙入口与右上角按钮(10)之下：不挡操作 */
            pointer-events: none;
            padding: 4px; /* 光带厚度 */
            /* 遮罩挖空内容区：仅保留 padding 形成的四周环形带 */
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            overflow: hidden;
        }
        /* 旋转光束：超大锥形渐变绕视口中心自转，两道主题色光带对置接力 */
        #edgeBeam::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 142vmax; /* √2×视口较长边：内切圆恰好覆盖视口对角线，纹理面积较 200vmax 减半，降低全屏显存压力 */
            height: 142vmax;
            margin: -71vmax 0 0 -71vmax; /* 中心对齐视口中心 */
            will-change: transform; /* 常驻合成层：避免超大纹理被反复驱逐/重建引发闪屏 */
            background: conic-gradient(
                transparent 0deg,
                var(--neon-green) 22deg, var(--neon-green) 58deg, transparent 88deg,
                transparent 180deg,
                var(--neon-green) 202deg, var(--neon-green) 238deg, transparent 268deg);
            opacity: 0.6; /* 亮度弱于机台边框灯带，氛围不喧宾夺主 */
            animation: beamOrbit 10s linear infinite;
        }
        /* 光束匀速自转一周：形成光带沿四边连续巡游的观感 */
        @keyframes beamOrbit {
            to { transform: rotate(1turn); }
        }
        /* 音效开关按钮（固定右上角，覆盖全局 button 主题底色） */
        .sound-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            margin-top: 0;
            width: 150px;
            padding: 8px 0;
            text-align: center;
            line-height: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--neon-green);
            background: rgba(18, 42, 18, 0.85);
            border: 1px solid rgba(57, 255, 106, 0.4);
            border-radius: 6px;
            box-shadow: none;
        }
        .sound-toggle:hover {
            background: rgba(57, 255, 106, 0.12);
            filter: none;
            box-shadow: 0 0 12px rgba(57, 255, 106, 0.5);
        }
        /* 全屏按钮（固定右上角音效开关下方，覆盖全局 button 主题底色） */
        .fs-toggle {
            position: fixed;
            top: 60px;
            right: 16px;
            z-index: 10;
            margin-top: 0;
            width: 150px;
            padding: 8px 0;
            text-align: center;
            line-height: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--neon-green);
            background: rgba(18, 42, 18, 0.85);
            border: 1px solid rgba(57, 255, 106, 0.4);
            border-radius: 6px;
            box-shadow: none;
        }
        .fs-toggle:hover {
            background: rgba(57, 255, 106, 0.12);
            filter: none;
            box-shadow: 0 0 12px rgba(57, 255, 106, 0.5);
        }
        /* ---------- 标题：SNAKE 绿色霓虹 ---------- */
        h1.title {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--neon-green);
            text-shadow: 0 0 16px rgba(57, 255, 106, 0.7);
            margin: 0 0 18px;
        }
        /* ---------- 主布局：左侧游戏容器 + 右侧键位说明栏 ---------- */
        .layout {
            display: flex;
            gap: 18px;
            align-items: flex-start; /* 侧栏顶边与游戏区外框顶边对齐，底边按内容自然收尾 */
        }
        /* ---------- 游戏容器（遮罩层相对其定位） ---------- */
        #gameContainer { position: relative; }
        /* 记分文字颜色：分数绿 / 最高分黄（文字由右侧 STATS 面板承载） */
        #score { color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 106, 0.6); }
        #highScore { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 210, 62, 0.6); }
        /* 游戏主画布：500×500，绿色霓虹边框与内外光晕 */
        #gameCanvas {
            display: block;
            /* 显式锁定 CSS 显示尺寸：snake.js 的 DPR 适配会把 width 属性放大为 CSS 尺寸×devicePixelRatio，
               若无此规则画布显示尺寸会跟随属性被撑大（布局爆裂），锁定后属性仅代表物理分辨率 */
            width: 500px;
            height: 500px;
            border: 3px solid var(--neon-green);
            border-radius: 4px;
            background-color: #0f1a12;
            box-shadow: 0 0 18px rgba(57, 255, 106, 0.35), inset 0 0 30px rgba(57, 255, 106, 0.06);
            /* 边框灯带：主题色三色流光循环，灯带宽度与光晕同全厅规范 */
            animation: canvasFlow 8s ease-in-out infinite;
            /* 对局中在画布上滑动手势转向：禁用触屏默认的滚动/缩放手势（页面为单屏布局，画布区域不承载滚动） */
            touch-action: none;
        }
        /* 边框流光灯带：主题绿 → 青绿 → 黄绿同族循环（贴合贪吃蛇主题色调） */
        @keyframes canvasFlow {
            0%, 100% { border-color: #39ff6a; box-shadow: 0 0 28px rgba(57, 255, 106, 0.4), inset 0 0 40px rgba(57, 255, 106, 0.08); }
            33% { border-color: #2fffd8; box-shadow: 0 0 32px rgba(47, 255, 216, 0.45), inset 0 0 40px rgba(47, 255, 216, 0.08); }
            66% { border-color: #a8ff3e; box-shadow: 0 0 32px rgba(168, 255, 62, 0.45), inset 0 0 40px rgba(168, 255, 62, 0.08); }
        }
        /* ---------- 遮罩层：开始 / 暂停 / 结束三块面板，居中覆盖在画布上 ---------- */
        #startScreen, #gameOverScreen, #pauseScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: var(--panel);
            padding: 22px;
            border-radius: 10px;
            border: 1px solid rgba(57, 255, 106, 0.4);
            box-shadow: 0 0 24px rgba(57, 255, 106, 0.25);
            animation: panelIn 0.3s ease-out; /* 面板入场：display 切换时自动重播 */
        }
        /* 面板入场动画：从略小略下位置淡入上移落定 */
        @keyframes panelIn {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        /* ---------- 用户偏好减弱动效：停用持续动画，保留静态样式 ---------- */
        @media (prefers-reduced-motion: reduce) {
            body::after, #edgeBeam::before, #gameCanvas,
            #startScreen, #gameOverScreen, #pauseScreen {
                animation: none; /* 边缘灯带流光 / 旋转光束 / 画布灯带循环 / 面板入场全部停用 */
            }
        }
        /* 遮罩标题：主题绿色 + 霓虹光晕 */
        h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: 4px; color: var(--neon-green); text-shadow: 0 0 12px rgba(57, 255, 106, 0.6); }
        p { margin: 6px 0; font-size: 14px; color: #b8b8d8; }
        /* ---------- 开始面板美化：英文副题 / 提示信息块 / 难度标签 ---------- */
        #startScreen h2 { margin-bottom: 6px; }
        .start-sub {
            margin: 0 0 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--neon-green);
            opacity: 0.85;
        }
        .start-tips {
            margin: 10px 0 0;
            padding: 9px 12px;
            background: rgba(57, 255, 106, 0.06);
            border-top: 1px solid rgba(57, 255, 106, 0.35);
            border-bottom: 1px solid rgba(57, 255, 106, 0.35);
            border-radius: 6px;
        }
        /* 提示分区标题：主题色小标签 + 右侧延伸线 */
        .start-tips .tips-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 4px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--neon-green);
        }
        .start-tips .tips-head:first-child { margin-top: 0; }
        .start-tips .tips-head::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(57, 255, 106, 0.25);
        }
        /* 玩法条目：整行排版，主题色箭头前缀 */
        .start-tips .tips-row {
            margin: 4px 0;
            font-size: 13px;
            line-height: 1.6;
            text-align: left;
        }
        .start-tips .tips-row.rule::before {
            content: "▸";
            margin-right: 6px;
            color: var(--neon-green);
            font-size: 11px;
        }
        .diff-label {
            margin: 12px 0 0;
            font-size: 11px;
            letter-spacing: 2px;
            color: #8a8ab0;
        }
        #newRecord {
            color: var(--neon-pink);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 62, 165, 0.6);
        }
        /* 全局按钮：开始 / 重新开始等主操作按钮（绿色主题） */
        button {
            padding: 10px 22px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            color: #0a140a;
            background-color: var(--neon-green);
            border: none;
            border-radius: 5px;
            margin-top: 12px;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(57, 255, 106, 0.45);
            transition: all 0.15s;
        }
        button:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 20px rgba(57, 255, 106, 0.7);
        }
        /* ---------- 难度选择：data-speed 为蛇速（ms/tick），data-points 为每个食物得分 ---------- */
        #difficultySelect {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .difficulty-btn {
            background-color: #2a2a4a;
            color: #b8b8d8;
            padding: 8px 16px;
            font-size: 10px;
            box-shadow: none;
        }
        .difficulty-btn:hover {
            background-color: #3a3a5e;
            filter: none;
            box-shadow: none;
        }
        .difficulty-btn.active {
            background-color: var(--neon-blue);
            color: #0a140a;
            box-shadow: 0 0 12px rgba(53, 224, 255, 0.5);
        }
        .difficulty-btn.active:hover {
            box-shadow: 0 0 18px rgba(53, 224, 255, 0.7);
        }
        /* ---------- 右侧键位说明栏：仿俄罗斯方块页 KEYS 面板（绿色主题） ---------- */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 190px;
        }
        .panel-box {
            background: rgba(18, 42, 18, 0.85);
            border: 1px solid rgba(57, 255, 106, 0.3);
            border-radius: 8px;
            padding: 12px;
        }
        .panel-box h3 {
            margin: 0 0 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--neon-green);
            letter-spacing: 2px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        .stat-row .label { color: #8a8ab0; }
        .stat-row .value {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
        }
        .keys p { margin: 4px 0; font-size: 12px; color: #b8b8d8; }
        .keys b { color: var(--neon-green); font-weight: normal; }
        /* 触屏点击优化：按钮/链接启用 manipulation，消除双击缩放判定带来的点击延迟 */
        button, a { touch-action: manipulation; }
    </style>
</head>
<body>
    <!-- 视口四周环绕光带：主题色霓虹流光沿屏幕边缘循环巡游 -->
    <div id="edgeBeam" aria-hidden="true"></div>
    <!-- 固定按钮区：成就墙入口（左上）+ 音效开关 / 全屏切换（右上） -->
    <!-- 成就墙·金杯触发器（全站统一开墙键 V 的可视化入口）：点击等效按 V 开合本游戏成就墙 -->
    <button class="achWallTrigger awt-fixed" type="button" style="--awt-h: var(--neon-green)" title="成就墙（快捷键 V）">
        <span class="awt-caption"><span class="awt-label">成就墙</span><span class="awt-key">V</span></span>
    </button>
    <button id="soundToggle" class="sound-toggle" type="button" title="单击：静音/恢复（快捷键 M）&#10;长按 / 右键：音量设置">♪ 声音 · 关</button>
    <button id="fullscreenToggle" class="fs-toggle" onclick="FS.toggle(this)" title="切换全屏（快捷键 F）">全屏 · 开</button>
    <h1 class="title">SNAKE</h1>
    <div class="layout">
        <div id="gameContainer">
            <!-- 游戏主画布：500×500，snake.js 在其上绘制棋盘、蛇与食物 -->
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            <!-- 开始遮罩：默认显示，含难度选择（无敌/简单/中等/困难）与开始按钮 -->
            <div id="startScreen">
                <h2>贪吃蛇</h2>
                <p class="start-sub">SNAKE</p>
                <div class="start-tips">
                    <div class="tips-head">玩法要点</div>
                    <div class="tips-row rule">吃食物成长得分，蛇身越长越要小心走位</div>
                    <div class="tips-row rule">3 秒内连续进食触发 COMBO，连击越高单颗得分加成越多</div>
                    <div class="tips-row rule">每吃 5 个食物提速一档（STATS 面板显示当前速度等级）</div>
                    <div class="tips-row rule">撞墙或咬到自己即结束</div>
                </div>
                <p class="diff-label">选择难度</p>
                <div id="difficultySelect">
                    <!-- 无敌难度：游玩参数与简单档一致（最宽松），额外开启无敌模式（撞墙环绕穿墙、撞自身直接穿过） -->
                    <button class="difficulty-btn" data-speed="200" data-points="5" data-invincible="1">无敌</button>
                    <button class="difficulty-btn" data-speed="200" data-points="5">简单</button>
                    <button class="difficulty-btn active" data-speed="150" data-points="10">中等</button>
                    <button class="difficulty-btn" data-speed="100" data-points="20">困难</button>
                </div>
                <button onclick="startGame()">开始游戏</button>
            </div>
            <!-- 暂停遮罩：空格暂停时由 snake.js 显示，再按空格继续 -->
            <div id="pauseScreen" style="display: none;">
                <h2>已暂停</h2>
                <p>按空格键继续</p>
                <!-- 进度镜像快照恢复提示：仅"上次进度恢复续玩"时由 snake.js 显示 -->
                <p id="pauseRestored" style="display: none;">已恢复上次进度</p>
            </div>
            <!-- 结束遮罩：显示最终分数与新纪录标记，提供重新开始按钮 -->
            <div id="gameOverScreen" style="display: none;">
                <h2>游戏结束</h2>
                <p>最终分数: <span id="finalScore">0</span></p>
                <p id="newRecord" style="display: none;">新纪录！</p>
                <button onclick="startGame()">重新开始</button>
            </div>
        </div>
        <!-- 侧边信息栏：STATS 记分面板（snake.js 按 id 实时刷新）+ KEYS 键位面板 -->
        <div class="side-panel">
            <div class="panel-box">
                <h3>STATS</h3>
                <div class="stat-row"><span class="label">当前</span><span class="value" id="score">SCORE 0</span></div>
                <!-- 速度等级：每吃 5 个食物提速一档，snake.js 实时刷新 -->
                <div class="stat-row"><span class="label">速度</span><span class="value" id="speedLevel">LV 1</span></div>
                <div class="stat-row"><span class="label">最高</span><span class="value" id="highScore">HI 0</span></div>
                <!-- 每日挑战目标（2026-11-04 新增）：当日由日期哈希生成的目标长度，snake.js 实时刷新 -->
                <div class="stat-row"><span class="label">今日</span><span class="value" id="dailyGoal">--</span></div>
            </div>
            <div class="panel-box keys">
                <h3>KEYS</h3>
                <p><b data-code="ArrowUp">↑</b> / <b data-code="KeyW">W</b> 向上</p>
                <p><b data-code="ArrowDown">↓</b> / <b data-code="KeyS">S</b> 向下</p>
                <p><b data-code="ArrowLeft">←</b> / <b data-code="KeyA">A</b> 向左</p>
                <p><b data-code="ArrowRight">→</b> / <b data-code="KeyD">D</b> 向右</p>
                <p><b data-code="Space">空格</b> 暂停 / 继续</p>
                <p><b data-code="KeyV">V</b> 成就墙</p>
                <p><b>触屏</b> 画布上滑动转向，可连续滑动</p>
            </div>
        </div>
    </div>
    <!-- ===================== 成就墙：DOM 全屏覆盖层（V/Esc 开合，打开时游戏逻辑冻结） ===================== -->
    <div id="achWall" hidden></div>
    <!-- 脚本加载顺序：arcade-common.js(Arcade 统一守卫/存档) → audio.js(SFX) fx.js(FX) → fullscreen.js(FS，仅供本页全屏按钮使用) → ach-common.js(共享成就系统，成就墙开合/解锁/存档迁移由此驱动) → snap-common.js(进度快照公共库) → pause-common.js(共享暂停引擎) → gamepad.js / ach-trigger.js → snake.js 游戏逻辑（依赖 audio.js 的 SFX 与 fx.js 的 FX） -->
    <script src="arcade-common.js?v=20261118-1"></script>
    <script src="audio.js?v=20261118-1"></script>
    <script src="fx.js?v=20261118-1"></script>
    <script src="fullscreen.js?v=20261118-1"></script>
    <script src="ach-common.js?v=20261118-3"></script>
    <script src="snap-common.js?v=20261118-1"></script>
    <script src="pause-common.js?v=20261118-1"></script>
    <!-- 手柄支持公共库：Gamepad API 轮询 → 边沿触发合成键盘事件，游戏键位零改动获得手柄支持 -->
    <script src="gamepad.js?v=20261118-1"></script>
    <script src="ach-trigger.js?v=20261118-1"></script>
    <script src="snake.js?v=20261118-2"></script>
</body>
</html>
