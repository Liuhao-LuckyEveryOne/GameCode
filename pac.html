<!DOCTYPE html>
<!-- ==================================================================
     吃豆人游戏页
     结构：左上角成就墙入口 → 右上角固定按钮（音效开关 / 全屏）→ PAC-MAN 彩色标题 →
          主布局（左：456×504 迷宫画布 + 三块遮罩；右：侧边信息栏
          LIVES 剩余生命 150×36 / STATS 分数·关卡·最高分 / KEYS 键位与得分说明）
     脚本：audio.js 公共音效库 / fx.js 全局特效库（成就解锁烟花）/ fullscreen.js 全屏控制 / gamepad.js 手柄支持 / pac.js 游戏逻辑
     共享：ach-common.js 共享成就系统（存档/迁移/解锁演出/成就墙/V-Esc 开合）/
          ach-trigger.css / ach-trigger.js 金杯成就墙触发器（点击等效按 V 开合成就墙）
     ================================================================== -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃豆人 - 像素街机厅</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- 成就墙·金杯触发器共享样式 -->
    <link rel="stylesheet" href="ach-trigger.css?v=20261118-2">
    <style>
        /* ---------- 主题变量：底色 / 面板 / 四色霓虹 / 文字 ---------- */
        :root {
            --bg: #14140a;
            --panel: rgba(42, 42, 18, 0.96);
            --neon-green: #39ff6a;
            --neon-pink: #ff3ea5;
            --neon-blue: #35e0ff;
            --neon-yellow: #ffd23e;
            --text: #fff8e8;
        /* ---- 成就墙皮肤主题映射（Wave2 收编）：本页仅留取值行，规则本体统一在 ach-trigger.css 收编层，取值与原页内皮肤逐字一致 ---- */
        --ach-accent: 255, 210, 62; /* 主题色 RGB 三元组：面板描边/辉光、关闭键、脚注、副标题 */
        --ach-sec: 53, 224, 255; /* 次主题色 RGB 三元组：计数文本 */
        --ach-wall-bg: rgba(6, 8, 14, 0.72); /* 遮罩底色 */
        --ach-panel-grad: linear-gradient(160deg, rgba(16, 26, 44, 0.80) 0%, rgba(12, 18, 32, 0.80) 55%, rgba(22, 26, 14, 0.80) 100%); /* 面板渐变底 */
        --ach-panel-glow: rgba(53, 224, 255, 0.20); /* 面板外辉光段 */
        --ach-desc-c: #8a94b8; /* 卡片描述文字 */
        --ach-meta-c: #6f7a96; /* 进度区元信息文字 */
        --ach-locked-c: #6f7a8a; /* 未解锁卡片名称 */
        --ach-unlock-desc-c: #b0bcd8; /* 已解锁卡片描述 */
        --ach-bar-grad: linear-gradient(90deg, #ffd23e, #35e0ff); /* 总进度条渐变 */
        --ach-prog-grad: linear-gradient(90deg, #ffd23e, #35e0ff); /* 卡片进度条渐变 */
        --ach-unlock-prog-grad: linear-gradient(90deg, #35e0ff, #ff3ea5); /* 已解锁卡片进度条渐变 */
        --ach-toast-grad: linear-gradient(120deg, rgba(20, 28, 44, 0.95), rgba(12, 16, 26, 0.95)); /* toast 渐变底 */
        /* ---- 稀有度四档徽章配色（RGB 三元组，与卡片描边/toast 左缘同源）：普通=主题金灰调、稀有/史诗=页内霓虹、传说=页内金 ---- */
        --ach-chip-common: 212, 196, 159; /* 普通档：主题金降饱和灰调 */
        --ach-chip-rare: 53, 224, 255; /* 稀有档：页内霓虹青（与次主题色一致） */
        --ach-chip-epic: 255, 62, 165; /* 史诗档：页内霓虹粉 */
        --ach-chip-legend: 255, 210, 62; /* 传说档：页内金色 */
        }
        /* html 画布底色随主题：全屏切换瞬间 overflow 切换 + 合成层重建触发重新光栅化，会间歇性闪现画布默认白底（视口底部白条根因），画布底色变暗后不可见 */
        html { background: var(--bg); }

        /* ---------- 基础布局：全屏垂直居中 ---------- */
        * { box-sizing: border-box; }
        body {
            user-select: none; /* 全局禁止文本选取：鼠标拖动不再框选界面文字、不触发浏览器选中搜索 */
            -webkit-user-select: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: radial-gradient(ellipse at 50% 0%, #40401c 0%, var(--bg) 65%);
            font-family: 'Microsoft YaHei', sans-serif;
            color: var(--text);
        }
        /* CRT 扫描线氛围 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
        }
        /* 视口边缘氛围灯带：弱于游戏区边框灯带，勾勒屏幕轮廓而不喧宾夺主 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            transform: translateZ(0); /* 独立合成层：edgeFlow 的 box-shadow 每帧重绘隔离于本层，不再与 hover 重绘叠加波及整页引发闪屏 */
            box-shadow: inset 0 0 64px rgba(255, 154, 62, 0.10);
            animation: edgeFlow 8s ease-in-out infinite;
        }
        /* 边缘灯带流光：橙 → 粉 → 蓝循环（与画布灯带同节奏、低亮度） */
        @keyframes edgeFlow {
            0%, 100% { box-shadow: inset 0 0 64px rgba(255, 154, 62, 0.10); }
            33% { box-shadow: inset 0 0 64px rgba(255, 62, 165, 0.11); }
            66% { box-shadow: inset 0 0 64px rgba(53, 224, 255, 0.11); }
        }
        /* ---------- 视口四周环绕光带：主题色霓虹流光绕屏幕边缘匀速巡游 ---------- */
        #edgeBeam {
            position: fixed;
            inset: 0;
            z-index: 6; /* 置于暗角之上、左上角成就墙入口与右上角按钮(10)之下：不挡操作 */
            pointer-events: none;
            padding: 4px; /* 光带厚度 */
            /* 遮罩挖空内容区：仅保留 padding 形成的四周环形带 */
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            overflow: hidden;
        }
        /* 旋转光束：超大锥形渐变绕视口中心自转，两道主题色光带对置接力 */
        #edgeBeam::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 142vmax; /* √2×视口较长边：内切圆恰好覆盖视口对角线，纹理面积较 200vmax 减半，降低全屏显存压力 */
            height: 142vmax;
            margin: -71vmax 0 0 -71vmax; /* 中心对齐视口中心 */
            will-change: transform; /* 常驻合成层：避免超大纹理被反复驱逐/重建引发闪屏 */
            background: conic-gradient(
                transparent 0deg,
                var(--neon-yellow) 22deg, var(--neon-yellow) 58deg, transparent 88deg,
                transparent 180deg,
                var(--neon-yellow) 202deg, var(--neon-yellow) 238deg, transparent 268deg);
            opacity: 0.6; /* 亮度弱于机台边框灯带，氛围不喧宾夺主 */
            animation: beamOrbit 10s linear infinite;
        }
        /* 光束匀速自转一周：形成光带沿四边连续巡游的观感 */
        @keyframes beamOrbit {
            to { transform: rotate(1turn); }
        }
        /* 音效开关按钮（固定右上角，覆盖全局 button 主题底色） */
        .sound-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            margin-top: 0;
            width: 150px;
            padding: 8px 0;
            text-align: center;
            line-height: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--neon-yellow);
            background: rgba(42, 42, 18, 0.85);
            border: 1px solid rgba(255, 210, 62, 0.4);
            border-radius: 6px;
            box-shadow: none;
        }
        .sound-toggle:hover {
            background: rgba(255, 210, 62, 0.12);
            filter: none;
            box-shadow: 0 0 12px rgba(255, 210, 62, 0.5);
        }
        /* 全屏按钮（固定右上角音效开关下方，覆盖全局 button 主题底色） */
        .fs-toggle {
            position: fixed;
            top: 60px;
            right: 16px;
            z-index: 10;
            margin-top: 0;
            width: 150px;
            padding: 8px 0;
            text-align: center;
            line-height: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--neon-yellow);
            background: rgba(42, 42, 18, 0.85);
            border: 1px solid rgba(255, 210, 62, 0.4);
            border-radius: 6px;
            box-shadow: none;
        }
        .fs-toggle:hover {
            background: rgba(255, 210, 62, 0.12);
            filter: none;
            box-shadow: 0 0 12px rgba(255, 210, 62, 0.5);
        }
        /* ---------- 标题：PAC-MAN 每字母彩色霓虹 ---------- */
        h1.title {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            letter-spacing: 6px;
            margin: 0 0 18px;
        }
        /* 每个字母带自身颜色的霓虹光晕 */
        h1.title span { text-shadow: 0 0 16px currentColor; }
        /* ---------- 主布局：左侧迷宫容器 + 右侧侧边信息栏 ---------- */
        .layout {
            display: flex;
            gap: 18px;
            align-items: flex-start; /* 侧栏顶边与游戏区外框顶边对齐，底边按内容自然收尾 */
        }
        /* 游戏容器（遮罩层相对其定位）与迷宫画布：456×504，黄色霓虹边框 */
        #gameContainer { position: relative; }
        #game {
            display: block;
            /* 固定 CSS 逻辑尺寸：物理分辨率由 FX.setupCanvas 按 DPR 放大，布局恒为 456×504 */
            width: 456px;
            height: 504px;
            /* 触屏滑动转向专属：禁用画布上的浏览器默认触摸行为（滚动/缩放），滑动手势不被页面滚动打断 */
            touch-action: none;
            border: 3px solid var(--neon-yellow);
            border-radius: 4px;
            background-color: #1a1a0f;
            box-shadow: 0 0 18px rgba(255, 210, 62, 0.35), inset 0 0 30px rgba(255, 210, 62, 0.06);
            /* 边框灯带：与 1024 机台同款三色流光循环 */
            animation: canvasFlow 8s ease-in-out infinite;
        }
        /* 边框流光灯带：主题黄 → 暖橙 → 浅金同族循环（贴合吃豆人主题色调） */
        @keyframes canvasFlow {
            0%, 100% { border-color: #ffd23e; box-shadow: 0 0 28px rgba(255, 210, 62, 0.4), inset 0 0 40px rgba(255, 210, 62, 0.08); }
            33% { border-color: #ff9a3e; box-shadow: 0 0 32px rgba(255, 154, 62, 0.45), inset 0 0 40px rgba(255, 154, 62, 0.08); }
            66% { border-color: #ffe98a; box-shadow: 0 0 32px rgba(255, 233, 138, 0.45), inset 0 0 40px rgba(255, 233, 138, 0.08); }
        }
        /* ---------- 侧边信息栏 ---------- */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 190px;
        }
        .panel-box {
            background: rgba(42, 42, 18, 0.85);
            border: 1px solid rgba(255, 210, 62, 0.3);
            border-radius: 8px;
            padding: 12px;
        }
        .panel-box h3 {
            margin: 0 0 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--neon-yellow);
            letter-spacing: 2px;
        }
        #livesCanvas {
            display: block;
            margin: 0 auto;
            background: #1a1a0f;
            border-radius: 4px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        .stat-row .label { color: #8a8ab0; }
        .stat-row .value {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
        }
        #scoreVal { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 210, 62, 0.6); }
        #levelVal { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 62, 165, 0.6); }
        #highVal { color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 106, 0.6); }
        .keys p { margin: 4px 0; font-size: 12px; color: #b8b8d8; }
        .keys b { color: var(--neon-yellow); font-weight: normal; }
        /* ---------- 遮罩层 ---------- */
        #startScreen, #gameOverScreen, #pauseScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            text-align: center;
            background-color: var(--panel);
            padding: 18px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 210, 62, 0.4);
            box-shadow: 0 0 24px rgba(255, 210, 62, 0.25);
            animation: panelIn 0.3s ease-out; /* 面板入场：display 切换时自动重播 */
        }
        /* 面板入场动画：从略小略下位置淡入上移落定 */
        @keyframes panelIn {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            body::after, #edgeBeam::before, #game,
            #startScreen, #gameOverScreen, #pauseScreen {
                animation: none; /* 边缘灯带流光 / 旋转光束 / 画布灯带循环 / 面板入场全部停用 */
            }
        }
        /* 遮罩标题：主题黄色 + 霓虹光晕 */
        h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: 4px; color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255, 210, 62, 0.6); }
        p { margin: 6px 0; font-size: 13px; color: #b8b8d8; }
        /* ---------- 开始面板美化：英文副题 / 提示信息块 / 难度标签 ---------- */
        #startScreen h2 { margin-bottom: 6px; }
        .start-sub {
            margin: 0 0 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--neon-yellow);
            opacity: 0.85;
        }
        .start-tips {
            margin: 10px 0 0;
            padding: 9px 12px;
            background: rgba(255, 210, 62, 0.06);
            border-top: 1px solid rgba(255, 210, 62, 0.35);
            border-bottom: 1px solid rgba(255, 210, 62, 0.35);
            border-radius: 6px;
        }
        /* 提示分区标题：主题色小标签 + 右侧延伸线 */
        .start-tips .tips-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 4px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--neon-yellow);
        }
        .start-tips .tips-head:first-child { margin-top: 0; }
        .start-tips .tips-head::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 210, 62, 0.25);
        }
        /* 玩法条目：整行排版，主题色箭头前缀 */
        .start-tips .tips-row {
            margin: 4px 0;
            font-size: 13px;
            line-height: 1.6;
            text-align: left;
        }
        .start-tips .tips-row.rule::before {
            content: "▸";
            margin-right: 6px;
            color: var(--neon-yellow);
            font-size: 11px;
        }
        .diff-label {
            margin: 12px 0 0;
            font-size: 11px;
            letter-spacing: 2px;
            color: #8a8ab0;
        }
        #newRecord {
            color: var(--neon-pink);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 62, 165, 0.6);
        }
        /* 全局按钮：开始 / 重新开始等主操作按钮（黄色主题） */
        button {
            padding: 10px 22px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            color: #14140a;
            background-color: var(--neon-yellow);
            border: none;
            border-radius: 5px;
            margin-top: 12px;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(255, 210, 62, 0.45);
            transition: all 0.15s;
        }
        button:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 20px rgba(255, 210, 62, 0.7);
        }
        /* ---------- 难度选择 ---------- */
        #difficultySelect {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .difficulty-btn {
            background-color: #2a2a4a;
            color: #b8b8d8;
            padding: 8px 14px;
            font-size: 10px;
            box-shadow: none;
        }
        .difficulty-btn:hover {
            background-color: #3a3a5e;
            filter: none;
            box-shadow: none;
        }
        .difficulty-btn.active {
            background-color: var(--neon-yellow);
            color: #14140a;
            box-shadow: 0 0 12px rgba(255, 210, 62, 0.5);
        }
        .difficulty-btn.active:hover {
            box-shadow: 0 0 18px rgba(255, 210, 62, 0.7);
        }
        /* 触屏点击优化：按钮/链接启用 manipulation，消除双击缩放判定带来的点击延迟 */
        button, a { touch-action: manipulation; }
    </style>
</head>
<body>
    <!-- 视口四周环绕光带：主题色霓虹流光沿屏幕边缘循环巡游 -->
    <div id="edgeBeam" aria-hidden="true"></div>
    <!-- 固定按钮区：成就墙入口（左上）+ 音效开关 / 全屏切换（右上） -->
    <!-- 成就墙·金杯触发器（全站统一开墙键 V 的可视化入口）：点击等效按 V 开合本游戏成就墙 -->
    <button class="achWallTrigger awt-fixed" type="button" style="--awt-h: var(--neon-yellow)" title="成就墙（快捷键 V）">
        <span class="awt-caption"><span class="awt-label">成就墙</span><span class="awt-key">V</span></span>
    </button>
    <button id="soundToggle" class="sound-toggle" type="button" title="单击：静音/恢复（快捷键 M）&#10;长按 / 右键：音量设置">♪ 声音 · 关</button>
    <button id="fullscreenToggle" class="fs-toggle" title="切换全屏（快捷键 F）">全屏 · 开</button>
    <h1 class="title">
        <span style="color:#ffd23e">P</span><span style="color:#ff3ea5">A</span><span style="color:#35e0ff">C</span><span style="color:#39ff6a">-</span><span style="color:#ffb8de">M</span><span style="color:#ff3b3b">A</span><span style="color:#ffb347">N</span>
    </h1>
    <div class="layout">
        <div id="gameContainer">
            <!-- 游戏主画布：456×504，pac.js 在其上绘制迷宫、豆子、吃豆人与幽灵 -->
            <canvas id="game" width="456" height="504"></canvas>
            <!-- 开始遮罩：默认显示，含难度选择（data-fright=能量豆惊惧时长s、
                 data-ghspeed=幽灵速度、data-mult=计分倍率、
                 data-invincible=无敌模式标记，仅"无敌"按钮携带）与开始按钮 -->
            <div id="startScreen">
                <h2>吃豆人</h2>
                <p class="start-sub">PAC-MAN</p>
                <div class="start-tips">
                    <div class="tips-head">玩法要点</div>
                    <div class="tips-row rule">吃光所有豆子过关</div>
                    <div class="tips-row rule">躲开幽灵，被抓住损失生命</div>
                    <div class="tips-row rule">能量豆可反杀幽灵，连杀得分翻倍</div>
                </div>
                <p class="diff-label">选择难度</p>
                <div id="difficultySelect">
                    <button class="difficulty-btn" data-fright="10" data-ghspeed="80" data-mult="1" data-invincible="1">无敌</button>
                    <button class="difficulty-btn" data-fright="10" data-ghspeed="80" data-mult="1">简单</button>
                    <button class="difficulty-btn active" data-fright="8" data-ghspeed="95" data-mult="2">中等</button>
                    <button class="difficulty-btn" data-fright="6" data-ghspeed="110" data-mult="3">困难</button>
                </div>
                <button id="startBtn">开始游戏</button>
            </div>
            <!-- 暂停遮罩：P 键或空格暂停时由 pac.js 显示；restoreNote 仅快照恢复成功时追加显示 -->
            <div id="pauseScreen" style="display: none;">
                <h2>已暂停</h2>
                <p id="restoreNote" style="display: none;">已恢复上次进度</p>
                <p>按 P 键继续</p>
            </div>
            <!-- 结束遮罩：显示最终分数与新纪录标记，提供重新开始按钮 -->
            <div id="gameOverScreen" style="display: none;">
                <h2>游戏结束</h2>
                <p>最终分数: <span id="finalScore">0</span></p>
                <p id="newRecord" style="display: none;">新纪录！</p>
                <button id="againBtn">重新开始</button>
            </div>
        </div>
        <!-- 侧边信息栏：LIVES 剩余生命（150×36 Canvas）/ STATS 实时统计 / KEYS 键位与得分说明 -->
        <div class="side-panel">
            <div class="panel-box">
                <h3>LIVES</h3>
                <!-- 剩余生命画布：150×36，由 pac.js 绘制剩余的吃豆人图标 -->
                <canvas id="livesCanvas" width="150" height="36"></canvas>
            </div>
            <div class="panel-box">
                <h3>STATS</h3>
                <div class="stat-row"><span class="label">分数</span><span class="value" id="scoreVal">0</span></div>
                <div class="stat-row"><span class="label">关卡</span><span class="value" id="levelVal">1</span></div>
                <div class="stat-row"><span class="label">最高分</span><span class="value" id="highVal">0</span></div>
            </div>
            <div class="panel-box keys">
                <h3>KEYS</h3>
                <p><b data-code="ArrowUp">↑</b> / <b data-code="KeyW">W</b> 向上</p>
                <p><b data-code="ArrowDown">↓</b> / <b data-code="KeyS">S</b> 向下</p>
                <p><b data-code="ArrowLeft">←</b> / <b data-code="KeyA">A</b> 向左</p>
                <p><b data-code="ArrowRight">→</b> / <b data-code="KeyD">D</b> 向右</p>
                <p><b>触屏</b> 画布上滑动转向，可连续滑动</p>
                <p><b data-code="KeyP">P</b> 暂停</p>
                <p><b data-code="KeyV">V</b> 成就墙</p>
                <p><b>·</b> 豆子 10 分 ×倍率</p>
                <p><b>o</b> 能量豆 50 分 ×倍率</p>
                <p><b>反杀</b> 200/400/800/1600</p>
            </div>
        </div>
    </div>
    <!-- 成就墙：全屏 DOM 覆盖层锚元素（默认隐藏），V/Esc 开合与整墙 DOM 构建由共享库 ach-common.js 运行时完成 -->
    <div id="achWall" hidden></div>
    <!-- 脚本加载顺序：arcade-common.js(Arcade 统一守卫/存档) → audio.js(SFX) fx.js(FX) → fullscreen.js(FS，仅供本页全屏按钮使用) → ach-common.js(共享成就系统，依赖前述 SFX/FX/Arcade) → snap-common.js(进度快照公共库) → pause-common.js(共享暂停引擎) → pac.js 游戏逻辑（依赖 audio.js 的 SFX 与 fx.js 的 FX） -->
    <script src="arcade-common.js?v=20261120-2"></script>
    <script src="audio.js?v=20261120-2"></script>
    <script src="fx.js?v=20261120-2"></script>
    <script src="fullscreen.js?v=20261120-3"></script>
    <script src="ach-common.js?v=20261120-1"></script>
    <script src="snap-common.js?v=20261120-1"></script>
    <script src="pause-common.js?v=20261120-1"></script>
    <script src="audio-pac.js?v=20261119-4"></script>
    <!-- 手柄支持公共库：Gamepad API 轮询 → 边沿触发合成键盘事件，游戏键位零改动获得手柄支持 -->
    <script src="gamepad.js?v=20261120-2"></script>
    <script src="ach-trigger.js?v=20261120-1"></script>
    <script src="pac.js?v=20261120-2"></script>
</body>
</html>
